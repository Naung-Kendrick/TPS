<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Public+Sans:wght@700&display=swap"
    rel="stylesheet">
  <title>Ta'ang Population System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; -webkit-text-size-adjust: 100%; }

    /* Tables scroll horizontally on small screens */
    table { width: 100%; }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    @media (max-width: 767px) {
      /* Page containers */
      .max-w-7xl { padding-left: 12px !important; padding-right: 12px !important; }

      /* Reduce page-level padding on mobile */
      [style*="padding: 32px"] { padding: 16px !important; }
      [style*="padding: '32px'"] { padding: 16px !important; }

      /* Stat cards stack */
      [style*="grid-template-columns: repeat(4"] {
        grid-template-columns: repeat(2, 1fr) !important;
      }
      [style*="repeat(auto-fill, minmax(300px"] {
        grid-template-columns: 1fr !important;
      }
      [style*="repeat(auto-fill, minmax(400px"] {
        grid-template-columns: 1fr !important;
      }

      /* Modal full-screen on mobile */
      [style*="maxWidth: '860px'"],
      [style*="maxWidth: '1080px'"] {
        max-width: 100% !important;
        margin: 0 !important;
        max-height: 100vh !important;
        border-radius: 0 !important;
      }

      /* Inputs readable size */
      input, select, textarea {
        font-size: 16px !important; /* prevents iOS zoom */
      }
    }

    @media (max-width: 480px) {
      /* Single column on very small phones */
      [style*="grid-template-columns: repeat(2"] {
        grid-template-columns: 1fr !important;
      }
      [style*="gridTemplateColumns: 'repeat(3"] {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
