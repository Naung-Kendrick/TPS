<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1A1A1A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="TPS" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Public+Sans:wght@700&display=swap&subset=latin"
    rel="stylesheet">
  <title>Ta'ang Population System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; -webkit-text-size-adjust: 100%; }

    /* Tables scroll horizontally on small screens */
    table { width: 100%; }

    @media (max-width: 767px) {
      /* Page containers */
      .max-w-7xl { padding-left: 12px !important; padding-right: 12px !important; }

      /* Reduce page-level padding on mobile */
      [style*="padding: 32px"] { padding: 16px !important; }

      /* Stat cards stack */
      [style*="grid-template-columns: repeat(4"] {
        grid-template-columns: repeat(2, 1fr) !important;
      }

      /* Inputs compact text size across all responsive screens */
      input, select, textarea {
        font-size: 11px !important;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
